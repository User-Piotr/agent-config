name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Warnings and errors fail the job; info notes such as SC2016 on the
      # deliberately single-quoted test commands do not.
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: guard tests
        run: bash claude/tests/guards.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validation is local to the manifests; it needs the CLI, not a login.
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate marketplace and plugins
        run: |
          claude plugin validate .
          claude plugin validate plugins/morph
          claude plugin validate plugins/devops
